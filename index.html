<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Online Bingo Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai/dist/index.js"
        }
      }
    </script>
    <style>
      @keyframes move-background {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 100% 100%;
        }
      }
      body {
        background-color: #0a0a2a;
        background-image:
          radial-gradient(circle at 25% 25%, rgba(0, 255, 255, 0.2) 0%, rgba(0, 255, 255, 0) 50%),
          radial-gradient(circle at 75% 75%, rgba(255, 0, 255, 0.2) 0%, rgba(255, 0, 255, 0) 50%),
          linear-gradient(45deg, #0a0a2a 0%, #000000 100%);
        background-size: 200% 200%;
        animation: move-background 30s ease-in-out infinite alternate;
      }
    </style>
  </head>
  <body class="text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
